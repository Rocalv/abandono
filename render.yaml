# Despliegue en Render (plan gratuito) como "Blueprint".
# Render lee este archivo y crea el servicio web solo.
services:
  - type: web
    name: abandono-azar
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: ADMIN_KEY
        sync: false   # Render te pide que escribas la clave del panel al crear el servicio
